name: Debug VD Metadata
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${TDX_CLIENT_ID}&client_secret=${TDX_CLIENT_SECRET}" \
            | jq -r .access_token)

          curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/VD/City/Taipei?%24format=JSON" -o /tmp/meta.json

          echo "Total VD count:"; jq '.VDs | length' /tmp/meta.json

          echo "--- VDs within Huxing Li bounding box (lat 25.0638-25.0768, lon 121.5887-121.6049) ---"
          jq '[.VDs[] | select(.PositionLat >= 25.0638 and .PositionLat <= 25.0768 and .PositionLon >= 121.5887 and .PositionLon <= 121.6049)]' /tmp/meta.json

          echo "--- All VDs with RoadName containing 內湖 ---"
          jq '[.VDs[] | select(.RoadName | contains("內湖"))] | length' /tmp/meta.json
