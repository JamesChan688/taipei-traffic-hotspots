name: Debug VD Metadata
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: check
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -s -X POST "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials&client_id=${TDX_CLIENT_ID}&client_secret=${TDX_CLIENT_SECRET}" \
            | jq -r .access_token)

          curl -s -H "Authorization: Bearer ${TOKEN}" \
            "https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/VD/City/Taipei?%24format=JSON" -o /tmp/meta.json

          echo "--- VDs within extended bbox (lat 25.0638-25.0768, lon 121.5798-121.6049), excluding known 5 ---"
          jq '
            [.VDs[] | select(
              .PositionLat >= 25.0638 and .PositionLat <= 25.0768 and
              .PositionLon >= 121.5798 and .PositionLon <= 121.6049 and
              (.VDID as $id | (["VQ6WK40","VQKWL40","VQKWL60","VQKWL61","VSQYA00"] | index($id)) == null)
            ) | {VDID, RoadName, PositionLat, PositionLon, RoadClass}]
          ' /tmp/meta.json
